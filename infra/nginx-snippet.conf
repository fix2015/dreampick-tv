# ============================================================
# Nginx server block for dreampick-tv.probooking.app
# Place this as /etc/nginx/sites-available/dreampick-tv.probooking.app
# then: ln -s /etc/nginx/sites-available/dreampick-tv.probooking.app /etc/nginx/sites-enabled/
# then: sudo certbot --nginx -d dreampick-tv.probooking.app
# then: sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name dreampick-tv.probooking.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dreampick-tv.probooking.app;

    # SSL certs will be added by certbot
    # ssl_certificate /etc/letsencrypt/live/dreampick-tv.probooking.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dreampick-tv.probooking.app/privkey.pem;

    # Frontend
    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
